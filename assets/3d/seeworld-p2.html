<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEEWORLD P2 · Visor 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    color: #eef1f6;
  }
  .viewer-wrap { position: relative; width: 100%; height: 100vh; }
  #viewer-canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #viewer-canvas:active { cursor: grabbing; }
  #annotate-canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; touch-action: none;
  }
  #annotate-canvas.active { pointer-events: auto; cursor: crosshair; }

</style>
</head>
<body>

<div class="viewer-wrap">
  <canvas id="viewer-canvas"></canvas>
  <canvas id="annotate-canvas"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('viewer-canvas');
  const wrap = canvas.parentElement;
  const annCanvas = document.getElementById('annotate-canvas');
  const annCtx = annCanvas.getContext('2d');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 6);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  else if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.toneMappingExposure = 1.0;

  function resize() {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    // Keep the annotation canvas's pixel grid matched to its displayed
    // size (otherwise clicks and drawn lines drift off from the cursor).
    const prev = annCanvas.width && annCanvas.height
      ? annCtx.getImageData(0, 0, annCanvas.width, annCanvas.height) : null;
    annCanvas.width = w;
    annCanvas.height = h;
    if (prev) annCtx.putImageData(prev, 0, 0);
  }
  window.addEventListener('resize', resize);

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  const key = new THREE.DirectionalLight(0xffffff, 0.34);
  key.position.set(0, 3, 10);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.14);
  fill.position.set(-6, 2, -4);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.12);
  rim.position.set(0, -4, -6);
  scene.add(rim);

  const group = new THREE.Group();
  scene.add(group);

  // Proportions measured directly from the product photos (SEEWORLD
  // P2(LA) GPS tracker, "capsule/pastilla" case): the front-face photo's
  // own body silhouette (mounting clips excluded) measures 678x339px in
  // the source photo, i.e. a 2.00:1 width:height ratio -- that ratio
  // drives BOX_W/BOX_H directly. There is no clean straight-on side shot
  // among the 5 reference photos (only 3/4-angle shots that foreshorten
  // the thickness), so BOX_D is a visual estimate, not a pixel
  // measurement -- the piece most likely to need correcting once someone
  // can compare against the real part or a proper side photo.
  const BOX_W = 2.0;    // length (long axis)
  // Corrected after cropping the mounting clips OUT of the cap photos:
  // the clips were inflating the earlier "body height" pixel measurement
  // (they sit right at the top/bottom edge, so a naive silhouette bbox
  // partly counts them as body). With the clips actually excluded, the
  // clean front-photo crop measures 674x284px -- ratio 2.375:1, not the
  // earlier 2.0:1 -- so the case itself is flatter/more elongated than
  // the first pass modeled.
  const BOX_H = 1.05; // corrected from a genuine side-profile reference photo (previously estimated): clean orthographic measurement = 217.5px short-axis vs 412px long-axis = 0.528 ratio, not the earlier 0.421
  const BOX_D = 0.62; // corrected from the same side-profile photo: 128px thickness vs 412px long-axis = 0.311 ratio, not the earlier 0.2315 guess -- the real case is noticeably thicker/chunkier than the first two passes modeled
  // This device's entire silhouette IS the rounded shape -- a "stadium":
  // two full semicircular ends (radius = half the height) joined by
  // straight top/bottom edges. Reusing the same rounded-corner-box
  // construction as the rectangular viewers in this catalog, but setting
  // CORNER_R to exactly half of BOX_H turns it into a true stadium for
  // free: each corner arc's own tangent points land exactly on the
  // object's long-edge/end-cap seams, and the two arcs on each end
  // (top-right+bottom-right, top-left+bottom-left) meet with nothing
  // between them -- one continuous semicircular end, no separate
  // left/right wall piece needed (unlike the rectangular models, which
  // have 4 distinct straight walls).
  const CORNER_R = BOX_H / 2;
  // Finer than the rectangular models' 14 segments: there each corner arc
  // was a small ~3% chamfer; here two of them together form this shape's
  // entire visible end silhouette (a full 180 degrees), so it needs more
  // segments to stay smooth at this scale.
  const CORNER_SEGS = 22;

  const halfW = BOX_W / 2, halfH = BOX_H / 2, halfD = BOX_D / 2;
  // The side-profile photo also shows something the earlier passes had no way to see:
  // the back (QR/model-sticker face) is NOT a flat plane either -- it has its own
  // shallower dome, meeting the front dome at a thin seam line (a faint ridge visible
  // at roughly 66% of the way across the thickness, not at the very back edge). Both
  // caps below now go through the same buildDomeCapGeometry() function, just with
  // different peak heights, joined by a thin flat seam band where the pillars/edges live.
  const SEAM_HALF = 0.016;
  const FRONT_BULGE_FRAC = 0.656, BACK_BULGE_FRAC = 0.344; // measured seam position on the side-profile photo
  const domeSpan = BOX_D - 2 * SEAM_HALF;
  const peakZFront = domeSpan * FRONT_BULGE_FRAC;
  const peakZBack = domeSpan * BACK_BULGE_FRAC;
  const SW = BOX_W - 2 * CORNER_R; // straight top/bottom edge length
  const SH = BOX_H - 2 * CORNER_R; // == 0 by construction -- no left/right wall exists

  // Averaged from 5 sample patches taken across all 5 reference photos
  // (dark navy/charcoal plastic, not pure black).
  const BODY_COLOR = 0x383944;
  const plasticParams = {};

  const bodyGroup = new THREE.Group();
  group.add(bodyGroup);

  function arcPoints(cx, cy, r, a0, a1, segs) {
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const a = a0 + (a1 - a0) * (i / segs);
      pts.push(new THREE.Vector2(cx + r * Math.cos(a), cy + r * Math.sin(a)));
    }
    return pts;
  }

  const HALF_PI = Math.PI / 2;
  const corners = [
    { cx: halfW - CORNER_R, cy: halfH - CORNER_R, a0: 0 },
    { cx: -halfW + CORNER_R, cy: halfH - CORNER_R, a0: HALF_PI },
    { cx: -halfW + CORNER_R, cy: -halfH + CORNER_R, a0: Math.PI },
    { cx: halfW - CORNER_R, cy: -halfH + CORNER_R, a0: 3 * HALF_PI },
  ];

  function buildFullOutline() {
    const pts = [];
    corners.forEach(c => {
      arcPoints(c.cx, c.cy, CORNER_R, c.a0, c.a0 + HALF_PI, CORNER_SEGS).forEach(p => pts.push(p));
    });
    return pts;
  }

  function buildCapGeometry(outline, zConst, flipU) {
    const shape = new THREE.Shape(outline);
    const geo = new THREE.ShapeGeometry(shape);
    const pos = geo.attributes.position;
    const uv = geo.attributes.uv;
    const OVERLAP = 1.0015;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const u = (flipU ? -x : x) / BOX_W + 0.5;
      const v = y / BOX_H + 0.5;
      pos.setX(i, x * OVERLAP);
      pos.setY(i, y * OVERLAP);
      pos.setZ(i, zConst);
      uv.setXY(i, u, v);
    }
    pos.needsUpdate = true;
    uv.needsUpdate = true;
    geo.computeVertexNormals();
    return geo;
  }

  const FEATHER_COLOR = new THREE.Color(0xffffff);
  function addEdgeFeather(geo, insetU, insetV) {
    const uv = geo.attributes.uv;
    if (!uv) return;
    const count = uv.count;
    const colors = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const u = uv.getX(i), v = uv.getY(i);
      const du = insetU > 0 ? Math.max(0, Math.min(1, Math.min(u, 1 - u) / insetU)) : 1;
      const dv = insetV > 0 ? Math.max(0, Math.min(1, Math.min(v, 1 - v) / insetV)) : 1;
      const t = Math.sqrt(Math.min(du, dv));
      colors[i * 3 + 0] = FEATHER_COLOR.r + (1 - FEATHER_COLOR.r) * t;
      colors[i * 3 + 1] = FEATHER_COLOR.g + (1 - FEATHER_COLOR.g) * t;
      colors[i * 3 + 2] = FEATHER_COLOR.b + (1 - FEATHER_COLOR.b) * t;
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  }

  // ---- Front cap: a REAL dome, not a flat plane. ----
  // Re-examining the 3/4-angle photos: the SEEWORLD-logo face isn't a
  // flat panel with a separately-curved edge band bolted on (which is
  // what the first pass built, reusing the flat-cap + vertical-wall
  // construction from the rectangular viewers in this catalog) -- the
  // real surface curves continuously from the logo, over the whole top,
  // down into the sides, with no flat facet anywhere. The QR/model
  // sticker face (back), by contrast, sits on a visibly flatter panel
  // (and the device rests flush on that face in every angled photo),
  // consistent with a common two-shell design: a smoothly domed top
  // shell over a flatter bottom shell. So: back stays a flat cap (below,
  // unchanged technique); front becomes a proper radially-subdivided
  // dome, peaking along the object's own centerline (not a single point
  // -- for an elongated capsule the "apex" of the dome is a ridge running
  // the length of the piece, curving down at the two rounded ends too,
  // like a loaf of bread, not a single bump like a dome on a round box).
  const outline = buildFullOutline();
  const domeOutline = buildDomeOutline();
  const RING_FRACS = [1, 0.9, 0.76, 0.58, 0.36, 0.12, 0];
  const backGeo = buildDomeCapGeometry(domeOutline, -peakZBack, true, RING_FRACS);
  backGeo.translate(0, 0, -SEAM_HALF);
  addEdgeFeather(backGeo, 0.07, 0.07);

  // Same loop buildFullOutline() walks (corner arc, top edge, corner arc,
  // corner arc, bottom edge, corner arc), but the flat cap only needed
  // the OUTLINE (ShapeGeometry infers the two straight edges as single
  // implicit segments) -- a dome needs real resolution along those
  // straight edges too, plus, for every point, an "anchor" to collapse
  // toward as the dome descends from its rim: the local corner's own arc
  // center for the two rounded ends (so that end domes into a proper
  // hemisphere-ish cap), or the nearest point on the centerline for the
  // two straight edges (so that section domes into a rounded ridge).
  function buildDomeOutline() {
    const EDGE_SEGS = 12;
    const pts = [];
    function pushArc(c) {
      arcPoints(c.cx, c.cy, CORNER_R, c.a0, c.a0 + HALF_PI, CORNER_SEGS).forEach(p => {
        pts.push({ x: p.x, y: p.y, ax: c.cx, ay: c.cy });
      });
    }
    function pushEdge(x0, x1, y) {
      for (let i = 1; i < EDGE_SEGS; i++) {
        const x = x0 + (x1 - x0) * (i / EDGE_SEGS);
        pts.push({ x, y, ax: x, ay: 0 });
      }
    }
    pushArc(corners[0]);
    pushEdge(halfW - CORNER_R, -halfW + CORNER_R, halfH);
    pushArc(corners[1]);
    pushArc(corners[2]);
    pushEdge(-halfW + CORNER_R, halfW - CORNER_R, -halfH);
    pushArc(corners[3]);
    return pts;
  }

  // ringFracs: 1 = the true rim (matches the corner-pillar/edge geometry
  // below exactly, since both now come from the same arcPoints/CORNER_R
  // math), descending to 0 = fully collapsed onto the centerline ridge.
  // Denser near the rim, where curvature is highest.
  function buildDomeCapGeometry(domeOutline, peakZ, flipU, ringFracs) {
    const n = domeOutline.length;
    const positions = [], uvs = [], indices = [];
    const ringStart = [];
    for (let r = 0; r < ringFracs.length; r++) {
      ringStart.push(positions.length / 3);
      const f = ringFracs[r];
      for (let i = 0; i < n; i++) {
        const p = domeOutline[i];
        const x = p.ax + f * (p.x - p.ax);
        const y = p.ay + f * (p.y - p.ay);
        const z = peakZ * Math.sqrt(Math.max(0, 1 - f * f));
        positions.push(x, y, z);
        const u = (flipU ? -x : x) / BOX_W + 0.5;
        const v = y / BOX_H + 0.5;
        uvs.push(u, v);
      }
    }
    for (let r = 0; r < ringFracs.length - 1; r++) {
      const a0 = ringStart[r], b0 = ringStart[r + 1];
      for (let i = 0; i < n; i++) {
        const i2 = (i + 1) % n;
        indices.push(a0 + i, a0 + i2, b0 + i2);
        indices.push(a0 + i, b0 + i2, b0 + i);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    // Real (indexed) shared vertices per ring -- unlike the flat corner
    // pillars elsewhere in this catalog (which fake smooth shading with
    // hand-computed radial normals on purpose, since their z-fighting
    // history made minimizing moving parts more valuable than perfect
    // shading), this dome has no such history and benefits from genuinely
    // smooth, cross-triangle-averaged normals.
    geo.computeVertexNormals();
    return geo;
  }

  const frontGeo = buildDomeCapGeometry(domeOutline, peakZFront, false, RING_FRACS);
  frontGeo.translate(0, 0, SEAM_HALF);
  addEdgeFeather(frontGeo, 0.07, 0.07);

  function makePhotoMat(dataUri, repeatX, repeatY, opts) {
    opts = opts || {};
    // MeshLambertMaterial computes its lighting per-vertex, so a bumpMap's
    // per-fragment normal perturbation never actually reaches the shading --
    // that's why the earlier relief attempt was invisible. MeshPhongMaterial
    // shades per-fragment and does respect bumpMap, so swap to it only when
    // a bump map is actually requested (keeps every other material on this
    // model exactly as before).
    const MatClass = opts.bumpMap ? THREE.MeshPhongMaterial : THREE.MeshLambertMaterial;
    const mat = new MatClass({
      color: 0xffffff, vertexColors: true, ...plasticParams, side: THREE.DoubleSide,
      ...(opts.bumpMap ? { shininess: 14, specular: 0x1a1c24 } : {}),
      // The dome's own rim and the corner-pillar/edge geometry's own
      // z=0 edge (below) both come from the exact same arcPoints/CORNER_R
      // formula now (unlike a flat cap scaled from the box center against
      // a pillar expanded along its own local tangent -- two different
      // strategies that only approximately agree, the z-fighting cause
      // hunted down on the rectangular viewers in this catalog), so they
      // should coincide almost everywhere. The two ends of each pillar
      // still get a small LINEAR_MARGIN tangent extension the dome rim
      // doesn't share, so a small mismatch remains right at those two
      // points -- polygonOffset (units only, no slope-scaled factor)
      // keeps that from ever becoming a visible flicker.
      polygonOffset: true, polygonOffsetFactor: 0, polygonOffsetUnits: 1,
      // Some source photos (e.g. a cutout PNG with an alpha channel) carry
      // huge transparent padding around the product. When opts.alpha is
      // set we honor that alpha channel instead of rendering the padding
      // as an opaque block of whatever raw RGB sits underneath it.
      transparent: !!opts.alpha,
      alphaTest: opts.alpha ? 0.05 : 0,
    });
    const tex = new THREE.TextureLoader().load(dataUri);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    if (opts.crop) {
      // Zoom into just the photographed product inside the source image
      // (skipping its surrounding padding) and stretch that crop to fill
      // the whole mesh -- a UV-mapping choice, not a pixel edit, so the
      // original image file itself is never touched/re-saved.
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.offset.set(opts.crop.offsetX, opts.crop.offsetY);
      tex.repeat.set(opts.crop.repeatX, opts.crop.repeatY);
    } else if (repeatX && repeatX !== 1) {
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY || 1);
    } else {
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
    }
    mat.map = tex;
    if (opts.bumpMap) {
      // bumpMap alone is just a lighting trick -- it shades the surface as
      // if it had relief, but the mesh itself stays perfectly flat, so the
      // silhouette never actually changes and it still reads as "an image"
      // from an angle. displacementMap on the same texture actually moves
      // the mesh's own vertices outward along their normal (the plane
      // already has 14x14 segments to displace), so the raised parts of
      // the design really do stick out in 3D. Both are driven by the same
      // grayscale relief map (brighter = higher) so the shading and the
      // actual bump line up.
      const bump = new THREE.TextureLoader().load(opts.bumpMap);
      if (opts.crop) {
        bump.wrapS = THREE.ClampToEdgeWrapping;
        bump.wrapT = THREE.ClampToEdgeWrapping;
        bump.offset.set(opts.crop.offsetX, opts.crop.offsetY);
        bump.repeat.set(opts.crop.repeatX, opts.crop.repeatY);
      }
      mat.bumpMap = bump;
      mat.bumpScale = typeof opts.bumpScale === 'number' ? opts.bumpScale : 0.01;

      if (opts.displace) {
        const disp = new THREE.TextureLoader().load(opts.bumpMap);
        if (opts.crop) {
          disp.wrapS = THREE.ClampToEdgeWrapping;
          disp.wrapT = THREE.ClampToEdgeWrapping;
          disp.offset.set(opts.crop.offsetX, opts.crop.offsetY);
          disp.repeat.set(opts.crop.repeatX, opts.crop.repeatY);
        }
        const scale = typeof opts.displacementScale === 'number' ? opts.displacementScale : 0.03;
        mat.displacementMap = disp;
        mat.displacementScale = scale;
        // Mid-gray (0.5) in the relief map sits at zero displacement, so
        // the plate's baseline stays where every other piece (caps, trims)
        // was already tuned to expect -- only the brighter knob pushes
        // past that baseline, and darker recesses pull back slightly.
        mat.displacementBias = typeof opts.displacementBias === 'number' ? opts.displacementBias : -scale / 2;
      }
    }
    return mat;

  // ---- End pillars + straight edges: same makePhotoMat() as the caps,
  // just fed the SWATCH_TEX patch instead of a full cap photo -- one
  // material recipe for the entire model instead of a separate flat-
  // color path for these pieces. ----

  function buildCornerPillarSingle(c, flipU) {
    const a0 = c.a0, a1 = c.a0 + HALF_PI;
    const LINEAR_MARGIN = 0.03;
    function extendAlongTangent(pt, angle, sign) {
      const tx = -Math.sin(angle), ty = Math.cos(angle);
      return new THREE.Vector2(pt.x + tx * LINEAR_MARGIN * sign, pt.y + ty * LINEAR_MARGIN * sign);
    }
    const ring = arcPoints(c.cx, c.cy, CORNER_R, a0, a1, CORNER_SEGS);
    ring[0] = extendAlongTangent(ring[0], a0, -1);
    ring[ring.length - 1] = extendAlongTangent(ring[ring.length - 1], a1, 1);
    const positions = [], normals = [], uvs = [];
    for (let i = 0; i < ring.length - 1; i++) {
      const a = ring[i], b = ring[i + 1];
      const na = new THREE.Vector2(a.x - c.cx, a.y - c.cy).normalize();
      const nb = new THREE.Vector2(b.x - c.cx, b.y - c.cy).normalize();
      let u0 = i / (ring.length - 1), u1 = (i + 1) / (ring.length - 1);
      if (flipU) { u0 = 1 - u0; u1 = 1 - u1; }
      // zNear = -SEAM_HALF, zFar = +SEAM_HALF -- a thin straight band
      // spanning the small flat seam between the front and back domes.
      positions.push(a.x, a.y, -SEAM_HALF,  b.x, b.y, -SEAM_HALF,  b.x, b.y, SEAM_HALF);
      positions.push(a.x, a.y, -SEAM_HALF,  b.x, b.y, SEAM_HALF,       a.x, a.y, SEAM_HALF);
      normals.push(na.x, na.y, 0,  nb.x, nb.y, 0,  nb.x, nb.y, 0);
      normals.push(na.x, na.y, 0,  nb.x, nb.y, 0,  na.x, na.y, 0);
      uvs.push(u0, 0, u1, 0, u1, 1,  u0, 0, u1, 1, u0, 1);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    return geo;
  }

  const pillarFlip = [false, true, false, true];
  const pillarLabel = ['extremo derecho (arriba)', 'extremo izquierdo (arriba)', 'extremo izquierdo (abajo)', 'extremo derecho (abajo)'];
  corners.forEach((c, i) => {
    const pGeo = buildCornerPillarSingle(c, pillarFlip[i]);
    addEdgeFeather(pGeo, 0.06, 0.14);
    const pMesh = new THREE.Mesh(pGeo, makePhotoMat(SWATCH_TEX, 2, 1));
    pMesh.name = pillarLabel[i];
    bodyGroup.add(pMesh);

  function addSideWall(width, height, x, y, z, rotX, rotY, mat, flipV) {
    // Unit-sized plane, scaled to width/height via mesh.scale -- this way
    // the live editor below can resize the piece in real time (scale is a
    // cheap transform update) instead of rebuilding geometry every drag.
    const geo = new THREE.PlaneGeometry(1, 1, 14, 14);
    // No edge feather here: that fade-to-white was meant to blend this
    // piece into neighboring pieces at a shared seam, but this plaque
    // floats on its own above the body now, so the fade just showed up
    // as an unwanted box/shadow outline around the photo. insetU/V of 0
    // keeps the vertex "color" attribute present (the material expects
    // one) but makes it a flat, full-strength white -- i.e. no fade.
    addEdgeFeather(geo, 0, 0);
    if (flipV) {
      // Top and bottom edges use opposite-sign X rotations to fold the
      // same flat plane onto opposite faces of the box. That mirrors the
      // photo vertically on one of the two (it read upside down), so we
      // flip this geometry's own V coordinate to cancel that out -- the
      // shared material/texture crop is untouched, only this mesh's UVs.
      const uv = geo.attributes.uv;
      for (let i = 0; i < uv.count; i++) uv.setY(i, 1 - uv.getY(i));
      uv.needsUpdate = true;
    }
    const mesh = new THREE.Mesh(geo, mat);
    mesh.scale.set(width, height, 1);
    mesh.position.set(x, y, z);
    mesh.rotation.set(rotX, rotY, 0);
    bodyGroup.add(mesh);
    return mesh;
  }

  const EDGE_OVERLAP_X = 1.03;

  // with a small overlap past each end (WALL_Z_OVERLAP).
  const WALL_Z_OVERLAP = 0.006;
  const wallZ = 0;

  // Laterales largos (top/bottom straight edges): the supplied photo is a
  // 1500x1500 cutout PNG where the actual product only occupies a small
  // patch in the middle (x:317-1158, y:618-879px) surrounded by huge
  // transparent padding. The crop below zooms into exactly that product
  // patch via UV offset/repeat (the image FILE itself is untouched,
  // byte-for-byte the same upload) instead of stretching the whole
  // padded canvas onto the plate.
  //   - "sin torcerla": the plate's own width:height ratio is set to the
  //     crop's real pixel aspect ratio (891x303px), so the photo is
  //     scaled uniformly, never stretched/skewed.
  //   - "mas grande": the plate's width is the device's full real length
  //     (SW) -- as big as the long edge itself allows without distortion.
  //   - "sin fondo": alpha:true keeps honoring the PNG's transparent
  //     background, so no black/white matte shows around the product.
  // The plate is lifted slightly outside the seam rim (SIDE_PHOTO_Y_LIFT)
  // so it sits proud of the body instead of overlapping/z-fighting the
  // dome geometry, which is only shaped for the original tiny seam band.
  // Values baked in from the live editor (copied/pasted back from chat).
  // Tightened further per the red pen marks: keep only the two clips +
  // the notch between them, cutting out the flat/curved body edges that
  // were still visible on both sides.
  const SIDE_PHOTO_CROP = { offsetX: 0.0000, offsetY: 0.0000, repeatX: 1.0000, repeatY: 1.0000 };
  

  const sidePhotoMat = makePhotoMat(SIDE_LONG_TEX, 1, 1, {
    crop: SIDE_PHOTO_CROP, alpha: true,
    bumpMap: SIDE_HEIGHT_TEX, bumpScale: 0.025, // positive = design pushes outward/raised, not engraved
  });

  const SIDE_PHOTO_WIDTH = 0.7900;
  const SIDE_PHOTO_HEIGHT = 0.2800;
  const SIDE_PHOTO_X_OFFSET = 0.0000;
  const SIDE_PHOTO_Y_LIFT = 0.0000;
  const topWallMesh = addSideWall(SIDE_PHOTO_WIDTH, SIDE_PHOTO_HEIGHT, SIDE_PHOTO_X_OFFSET, halfH + SIDE_PHOTO_Y_LIFT, wallZ, -HALF_PI, 0, sidePhotoMat, true);
  const bottomWallMesh = addSideWall(SIDE_PHOTO_WIDTH, SIDE_PHOTO_HEIGHT, SIDE_PHOTO_X_OFFSET, -halfH - SIDE_PHOTO_Y_LIFT, wallZ, HALF_PI, 0, sidePhotoMat, false);
  topWallMesh.name = 'borde recto de arriba';
  bottomWallMesh.name = 'borde recto de abajo';

  // ---- Second copy of the same image, floating a little further out
  // (away from the body, same direction SIDE_PHOTO_Y_LIFT already uses)
  // than the first one, with a small visible gap between the two layers. ----
  const FRONT_LAYER_GAP = 0.04;
  const topWallMesh2 = addSideWall(SIDE_PHOTO_WIDTH, SIDE_PHOTO_HEIGHT, SIDE_PHOTO_X_OFFSET, halfH + SIDE_PHOTO_Y_LIFT + FRONT_LAYER_GAP, wallZ, -HALF_PI, 0, sidePhotoMat, true);
  const bottomWallMesh2 = addSideWall(SIDE_PHOTO_WIDTH, SIDE_PHOTO_HEIGHT, SIDE_PHOTO_X_OFFSET, -halfH - SIDE_PHOTO_Y_LIFT - FRONT_LAYER_GAP, wallZ, HALF_PI, 0, sidePhotoMat, false);
  topWallMesh2.name = 'borde recto de arriba (capa frontal)';
  bottomWallMesh2.name = 'borde recto de abajo (capa frontal)';

  // ---- Lateral caps only -- just the left/right sides of each clip's
  // own gap, nothing on the face ----
  // Earlier attempts filled the whole area behind each clip, which showed
  // up as an ugly flat swatch-textured patch wherever the camera can see
  // into the recess under the hook shape. This is much smaller: two thin
  // strips per clip, sitting exactly at its own left and right edge (not
  // wider, not narrower), spanning only the small FRONT_LAYER_GAP
  // thickness -- just closing the two open sides of the gap, leaving the
  // front, back, top and bottom of the gap completely untouched.
  const CLIP_U_RANGES = [
    { u0: 0 / 415, u1: 145 / 415 },   // left clip, measured from the photo's own alpha channel
    { u0: 271 / 415, u1: 415 / 415 }, // right clip, same measurement
  ];
  // The exact color-swatch image supplied for the lateral caps -- a plain
  // sample of the plastic's own edge color, used once (not tiled).
  const EDGE_STRIP_TEX = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAACCCAIAAAD9rb4YAAAEp0lEQVR4AbyXDbLbNgyECciv10wz+esRmmnai/cJyLcELdGW/JzJZEIvKRBYLiGKlk3/8Pnbp7/++/jlX4z3X779+fmfd5++gvcfv4J3H/4Gvph5a1Yl0iLaVNxMmDwPTXgSmeMZCWYPU6k7LjJHhbmuUXDL5tlQa7gzoJClbHWzypCoDowNs8fTWlhDNjMi10KzmCGl7CVimiBzk2wtvBPI5TWMD+uEY81cW6yGOzBSSjWIYGSC7IXpMsWO+N8DuWKpjVSAuaLTI2Kl7krijBqZhXxd19fX9YwUzZJcjXy8LTy8e1LXSE3CPJlqwgYpcpQxIYl2R3T6IG0xhbYRLIEC4c0i24qdwadFcz2AlmiBTFZhWid4QEqjBlc8wHn+gH5m4MY1I3vxcmHDiKDBBBjGpaJDiQ6uQmve0oOMGntkSVsc1s7gHugAg8NlAA5QVmZpPm5KKvCu8DV0k2PIuNzI4OMZKRMs1FAC2DtYo/SdRAAe7RFjCQjDpx3ZsPJC43mAQWpvlplUthZJS8VqMbJywniKGv2E9hOknsFIqNtaw8R6MpXCPzGdhp3UTWlenrJ39kbaXUdrJ5l5f3zZN1ZjN8LuT7PtJFyPMEiM5mlDYihbii7Cy+LgclkGifCGzlMDr5w7qbtJJWvPb3pQd1INOm3vSHQ7spYKW6PGReZZ7TnYOalitDXwnFQxWnjgeivGLwooj0Zigdpb6jPibZyT3A10JQ0/JynSKzxwR+rLk27t0ngFKFE4D5agq+yNi6k6jC3CIwN4hc2LAZn2iLoJxkAQlstibhuvB1yJu6K8PtlhcC4vbDM22uK+YXDdN9dyuby8vPwxFSlt4pvRpfeG1yHvdb1Jy7fxZoN8zsVuSc7ruy1O1r74Xkq42ucySELqzwvzFqVRLaTb4FlPJJZYUHXdSF+6mSzS3D+1PYNfJoUQ4tJVJKe6dQg8xY9N91QGguf4h4DdSGvHbvkvnE7TPKsPp5tSsoekWf13kLLvs97+wun4Qs03cmr/2HR584f5VKidKNmhsFVy28HnOu2qBA9AQoVWuP4N43ewK037TuFD9SFQXw4zCHYoTka1VIRgnMJhZF8FSIUjDyU4+n7COIbL49GPYTAK5b1rTxbzjkFXJM33ZhUJ7tvwWqdHpEpUSvCE64zHAZ6HZ5K9QEWGFnQl6dSiJibeO4h055q7iAGROOaA7A9nY9AFLDXw6zTJRAASLZCRo0hpmLd3AA9ABc4ByPR8sR+CJehCwTCMyFu9GsdBQj921akWHsA2Nw2N9IwQMjJVuRAGSY8ObYYSxzWDEChP/SackCoM7yp9VeIGdZuhc7AnZyihRRYeKuVU9EcJfTy0BWxQdrW6uwglUI+PcIEuKFvTlZURNY5WgzJDJ+VXimcmLpA5jLIzxjWTlytvD+6BY/3VwIvYDE239UNnvcgIJpqp/KUw3kAcxjJ1GiTGsRibkbJ7ZQmMfiEjB1KlnLQkznE6uhjdpmAy7CaNmw6MWy0cAm84tg1DpQEDH/mByHWDi8W3xgYvlVRuRRm0Jk5ZNoo8wzSr0HBxUV/rqetdJXEIS2sYDYtDxszA42bfAQAA//9CI40tAAAABklEQVQDADv18ExJkUnzAAAAAElFTkSuQmCC";
  function buildLateralCap(label) {
    // A flat sheet, not a box -- zero thickness, so there's no face
    // pointed at the front camera to read as an added border/patch. It's
    // turned 90° to stand edge-on across the gap (like a thin card
    // slotted in sideways): invisible from straight on, and only closes
    // the little open side of the gap when seen from an angle.
    const geo = new THREE.PlaneGeometry(1, 1);
    const tex = new THREE.TextureLoader().load(EDGE_STRIP_TEX);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    // Unlit on purpose: a lit material here can go nearly black wherever
    // this edge-on sheet faces away from the scene's light, which is
    // exactly the "black gap" that kept showing up at the clips' outer
    // edges. Unlit always shows the swatch's real color regardless of
    // which way it's turned.
    const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.set(0, HALF_PI, 0); // stand the sheet up across X, facing sideways instead of at the camera
    mesh.name = label;
    bodyGroup.add(mesh);
    return mesh;
  }
  // Only the OUTER edge of each clip (the one against the case body) gets
  // a lateral cap now. The two INNER edges (facing each other across the
  // middle gap) used to get one too, but an edge-on sheet is only
  // invisible from a perfectly straight-on camera -- from this viewer's
  // angled default view, those two inner sheets caught the light and
  // showed up as the pale double-line bar across the middle gap. Since the
  // middle gap is meant to be a plain empty notch (see reference photo),
  // those two are simply not built at all now.
  const topCaps = [
    buildLateralCap('tapa lateral exterior de pata izq. (arriba)'),
    buildLateralCap('tapa lateral exterior de pata der. (arriba)'),
  ];
  const bottomCaps = [
    buildLateralCap('tapa lateral exterior de pata izq. (abajo)'),
    buildLateralCap('tapa lateral exterior de pata der. (abajo)'),
  ];
  (function placeLateralCaps() {
    const h = FRONT_LAYER_GAP + 0.002; // spans just the gap between the two layers, tiny overlap so it never leaves a hairline seam of its own
    const plateLeft = SIDE_PHOTO_X_OFFSET - SIDE_PHOTO_WIDTH / 2;
    function placeOne(capSet, centerY) {
      CLIP_U_RANGES.forEach((range, i) => {
        const clipD = SIDE_PHOTO_HEIGHT;
        // Clip 0 (left clip) faces the case body on its own u0 side; clip 1
        // (right clip) faces the case body on its own u1 side -- whichever
        // edge is NOT adjacent to the middle gap.
        const outerU = i === 0 ? range.u0 : range.u1;
        const xOuter = plateLeft + outerU * SIDE_PHOTO_WIDTH;
        const cap = capSet[i];
        // Post-rotation (see buildLateralCap), local X maps to world Z and
        // local Y stays world Y -- so scale.x = the sheet's depth (clipD),
        // scale.y = the gap's own height (h). No thickness dimension to
        // set: it's a plane, sitting exactly at the clip's own edge.
        cap.scale.set(clipD, h, 1);
        cap.position.set(xOuter, centerY, wallZ);
      });
    }
    placeOne(topCaps, halfH + SIDE_PHOTO_Y_LIFT + FRONT_LAYER_GAP / 2);
    placeOne(bottomCaps, -halfH - SIDE_PHOTO_Y_LIFT - FRONT_LAYER_GAP / 2);
  })();

  // ---- Same sheets, the other two sides of each clip (arriba/abajo) ----
  // buildLateralCap's sheet already stands in the Y-Z plane (facing along
  // X) to close the left/right sides. These close the remaining two sides
  // -- the plane just needs no rotation at all: a bare PlaneGeometry
  // already lies in local XY with its normal along Z, which is exactly
  // the X/Y span + Z-facing normal these two sides need.
  function buildDepthCap(label) {
    const geo = new THREE.PlaneGeometry(1, 1);
    const tex = new THREE.TextureLoader().load(EDGE_STRIP_TEX);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    // Same reasoning as buildLateralCap: unlit so it can't go dark just
    // because of which way this face happens to point.
    const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.name = label;
    bodyGroup.add(mesh);
    return mesh;
  }
  // Both edges' clips get the same Z-facing depth caps now, matching the
  // front (bottom-edge) treatment on the back (top-edge, near the SEEWORLD
  // logo) clips too.
  const bottomDepthCaps = [
    [buildDepthCap('tapa arriba de pata izq. (abajo)'), buildDepthCap('tapa abajo de pata izq. (abajo)')],
    [buildDepthCap('tapa arriba de pata der. (abajo)'), buildDepthCap('tapa abajo de pata der. (abajo)')],
  ];
  const topDepthCaps = [
    [buildDepthCap('tapa arriba de pata izq. (arriba)'), buildDepthCap('tapa abajo de pata izq. (arriba)')],
    [buildDepthCap('tapa arriba de pata der. (arriba)'), buildDepthCap('tapa abajo de pata der. (arriba)')],
  ];
  (function placeDepthCaps() {
    // A little extra margin over the exact gap width so a hairline sliver
    // doesn't show at the outer tip where the flat cap meets the case's
    // own curved surface.
    const h = FRONT_LAYER_GAP + 0.01;
    const plateLeft = SIDE_PHOTO_X_OFFSET - SIDE_PHOTO_WIDTH / 2;
    function placeOne(capSet, centerY) {
      CLIP_U_RANGES.forEach((range, i) => {
        const clipW = (range.u1 - range.u0) * SIDE_PHOTO_WIDTH;
        const clipD = SIDE_PHOTO_HEIGHT;
        const clipCenterX = plateLeft + (range.u0 + range.u1) / 2 * SIDE_PHOTO_WIDTH;
        const [nearCap, farCap] = capSet[i];
        nearCap.scale.set(clipW, h, 1);
        nearCap.position.set(clipCenterX, centerY, wallZ + clipD / 2);
        farCap.scale.set(clipW, h, 1);
        farCap.position.set(clipCenterX, centerY, wallZ - clipD / 2);
      });
    }
    placeOne(bottomDepthCaps, -halfH - SIDE_PHOTO_Y_LIFT - FRONT_LAYER_GAP / 2);
    placeOne(topDepthCaps, halfH + SIDE_PHOTO_Y_LIFT + FRONT_LAYER_GAP / 2);
  })();

  // The middle bridge between the two clips needs its own cap closing the
  // notch, on both the near and far Z-face.
  const MIDDLE_RANGE = { u0: 145 / 415, u1: 271 / 415 }; // the gap between the two clips, same alpha-channel measurement
  // A single full plate per Z-face, same plastic-swatch material and the
  // same FRONT_LAYER_GAP-based height as the individual clips' own depth
  // caps (topDepthCaps/bottomDepthCaps below) -- that pattern already
  // looks right on the clips themselves, so the middle bridge now gets
  // the exact same treatment instead of the thin-trim/shadow combo that
  // kept showing artifacts. This closes the notch solidly on BOTH the
  // near and far side, matching "debe tener tapa de ambos lados".
  function buildMiddleBridgeCap(edgeLabel, yBack, yFront, zSideLabel, z) {
    // buildDepthCap is already unlit (MeshBasicMaterial) now, so this face
    // shows its real plastic color regardless of which way it points.
    const cap = buildDepthCap(`tapa union central ${edgeLabel} ${zSideLabel}`);
    const plateLeft = SIDE_PHOTO_X_OFFSET - SIDE_PHOTO_WIDTH / 2;
    const midW = (MIDDLE_RANGE.u1 - MIDDLE_RANGE.u0) * SIDE_PHOTO_WIDTH;
    const midCenterX = plateLeft + (MIDDLE_RANGE.u0 + MIDDLE_RANGE.u1) / 2 * SIDE_PHOTO_WIDTH;
    const h = Math.abs(yBack - yFront) + 0.01;
    const centerY = (yBack + yFront) / 2;
    cap.scale.set(midW, h, 1);
    cap.position.set(midCenterX, centerY, z);
    return { mesh: cap, baseY: centerY };
  }
  const midD = SIDE_PHOTO_HEIGHT;
  [
    { edgeLabel: 'borde de abajo', yBack: -halfH - SIDE_PHOTO_Y_LIFT, yFront: -halfH - SIDE_PHOTO_Y_LIFT - FRONT_LAYER_GAP },
    { edgeLabel: 'borde de arriba', yBack: halfH + SIDE_PHOTO_Y_LIFT, yFront: halfH + SIDE_PHOTO_Y_LIFT + FRONT_LAYER_GAP },
  ].forEach(({ edgeLabel, yBack, yFront }) => {
    buildMiddleBridgeCap(edgeLabel, yBack, yFront, 'cara abajo', wallZ - midD / 2);
    // "cara arriba" (near face) intentionally skipped -- not wanted.
  });

  // ---- Safety backing: only needs to backstop the thin seam band where
  // the pillars/edges and the two dome rims all meet -- both caps are
  // now one continuous indexed mesh each with no internal seams, so
  // unlike the rest of this catalog it doesn't need a backing hugging
  // a full peak height, just enough to cover the seam band. ----
  const BACKING_SCALE = 0.92;
  const backingOutline = outline.map(p => new THREE.Vector2(p.x * BACKING_SCALE, p.y * BACKING_SCALE));
  const backingShape = new THREE.Shape(backingOutline);
  const backingMargin = 0.05;
  const backingZ0 = -SEAM_HALF - backingMargin;
  const backingZ1 = SEAM_HALF + backingMargin;
  const backingGeo = new THREE.ExtrudeGeometry(backingShape, { depth: backingZ1 - backingZ0, bevelEnabled: false, curveSegments: CORNER_SEGS });
  backingGeo.translate(0, 0, backingZ0);
  const backingMat = new THREE.MeshBasicMaterial({ color: BODY_COLOR, side: THREE.DoubleSide });
  const backingMesh = new THREE.Mesh(backingGeo, backingMat);
  backingMesh.name = 'relleno de seguridad (no deberia verse)';
  bodyGroup.add(backingMesh);

  const shadowTex = (function () {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(128, 128, 10, 128, 128, 128);
    g.addColorStop(0, 'rgba(0,0,0,0.4)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  })();
  const shadowMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(3.5, 3.5),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
  );
  shadowMesh.position.set(0, -halfH - 0.35, 0);
  shadowMesh.rotation.x = -Math.PI / 2;
  scene.add(shadowMesh);

  // Static, dead-on frontal view by default -- drag to rotate, wheel/pinch to zoom.
  let isDown = false;
  let lastX = 0, lastY = 0;
  let rotY = 0, rotX = 0;
  let targetRotY = rotY, targetRotX = rotX;

  function pointerDown(x, y) { isDown = true; lastX = x; lastY = y; }
  function pointerMove(x, y) {
    if (!isDown) return;
    const dx = x - lastX, dy = y - lastY;
    lastX = x; lastY = y;
    targetRotY += dx * 0.008;
    targetRotX += dy * 0.008;
    targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
  }
  function pointerUp() { isDown = false; }

  canvas.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);
  canvas.addEventListener('touchstart', e => { const t = e.touches[0]; pointerDown(t.clientX, t.clientY); }, { passive: true });
  canvas.addEventListener('touchmove', e => { const t = e.touches[0]; pointerMove(t.clientX, t.clientY); }, { passive: true });
  canvas.addEventListener('touchend', pointerUp);

  let dist = 6;
  let targetDist = dist;
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    targetDist += e.deltaY * 0.006;
    targetDist = Math.max(3, Math.min(10, targetDist));
  }, { passive: false });

  let pinchStart = null;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchStart = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStart) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      targetDist += (pinchStart - d) * 0.01;
      targetDist = Math.max(3, Math.min(10, targetDist));
      pinchStart = d;
    }
  }, { passive: true });

  const STATIC_PREVIEW = new URLSearchParams(location.search).get('static') === '1';
  function animate() {
    requestAnimationFrame(animate);
    if (!STATIC_PREVIEW) targetRotY += 0.0035;
    rotY += (targetRotY - rotY) * 0.12;
    rotX += (targetRotX - rotX) * 0.12;
    dist += (targetDist - dist) * 0.12;
    group.rotation.y = rotY;
    group.rotation.x = rotX;
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  }

  resize();
  animate();
})();
</script>

<button id="capture-btn" style="position:fixed;left:10px;bottom:10px;z-index:999;padding:8px 14px;background:#111;color:#fff;border:0;border-radius:6px;font:13px system-ui;cursor:pointer;display:none;">Descargar imagen (WEBP)</button>
<script>
(function() {
  if (new URLSearchParams(location.search).get('capture') !== '1') return;
  var btn = document.getElementById('capture-btn');
  btn.style.display = 'block';
  btn.addEventListener('click', function() {
    var canvas = document.getElementById('viewer-canvas');
    canvas.toBlob(function(blob) {
      if (!blob) { alert('No se pudo capturar la imagen. Intenta girar el modelo y volver a intentar.'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'seeworld-p2.webp';
      a.click();
    }, 'image/webp', 0.92);
  });
})();
</script>
