<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salind 11 4G · Visor 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    color: #eef1f6;
  }
  .viewer-wrap {
    position: relative;
    width: 100%;
    height: 100vh;
  }
  #viewer-canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #viewer-canvas:active { cursor: grabbing; }
  .hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #8b95a8;
    background: rgba(0,0,0,0.35);
    padding: 6px 12px;
    border-radius: 999px;
    letter-spacing: 0.2px;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="viewer-wrap">
  <canvas id="viewer-canvas"></canvas>
  <div class="hint" style="display:none;">Arrastra para girar · rueda / pellizco para zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('viewer-canvas');
  const wrap = canvas.parentElement;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 15);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  else if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.toneMappingExposure = 1.0;

  function resize() {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    renderer.setSize(w, h, false);
    const aspect = w / h;
    camera.aspect = aspect;
    // En pantallas angostas (celular a pantalla completa) se agranda el
    // campo de visión vertical para que el objeto no se vea recortado o
    // demasiado acercado -- mantiene el ancho visible aproximadamente
    // constante sin importar la forma del contenedor.
    camera.fov = aspect < 1 ? Math.min(58, 35 / aspect) : 35;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.32);
  key.position.set(0, 3, 10);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.1);
  fill.position.set(-6, 2, -4);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.08);
  rim.position.set(0, -4, -6);
  scene.add(rim);

  const group = new THREE.Group();
  scene.add(group);

  const BOX_W = 3.9;
  const BOX_H = 5.5;
  const BOX_D = 1.45;
  const CORNER_R = 0.5;
  const CORNER_SEGS = 14;

  const halfW = BOX_W / 2, halfH = BOX_H / 2, halfD = BOX_D / 2;
  const SW = BOX_W - 2 * CORNER_R;
  const SH = BOX_H - 2 * CORNER_R;

  const BODY_COLOR = 0x020202;
  const plasticParams = {};

  const bodyGroup = new THREE.Group();
  group.add(bodyGroup);

  function arcPoints(cx, cy, r, a0, a1, segs) {
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const a = a0 + (a1 - a0) * (i / segs);
      pts.push(new THREE.Vector2(cx + r * Math.cos(a), cy + r * Math.sin(a)));
    }
    return pts;
  }

  const HALF_PI = Math.PI / 2;
  const corners = [
    { cx: halfW - CORNER_R, cy: halfH - CORNER_R, a0: 0 },
    { cx: -halfW + CORNER_R, cy: halfH - CORNER_R, a0: HALF_PI },
    { cx: -halfW + CORNER_R, cy: -halfH + CORNER_R, a0: Math.PI },
    { cx: halfW - CORNER_R, cy: -halfH + CORNER_R, a0: 3 * HALF_PI },
  ];

  function buildFullOutline() {
    const pts = [];
    corners.forEach(c => {
      arcPoints(c.cx, c.cy, CORNER_R, c.a0, c.a0 + HALF_PI, CORNER_SEGS).forEach(p => pts.push(p));
    });
    return pts;
  }

  function buildCapGeometry(outline, zConst, flipU) {
    const shape = new THREE.Shape(outline);
    const geo = new THREE.ShapeGeometry(shape);
    const pos = geo.attributes.position;
    const uv = geo.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      pos.setZ(i, zConst);
      const u = (flipU ? -x : x) / BOX_W + 0.5;
      const v = y / BOX_H + 0.5;
      uv.setXY(i, u, v);
    }
    pos.needsUpdate = true;
    uv.needsUpdate = true;
    geo.computeVertexNormals();
    return geo;
  }

  const FEATHER_COLOR = new THREE.Color(BODY_COLOR);
  function addEdgeFeather(geo, insetU, insetV) {
    const uv = geo.attributes.uv;
    if (!uv) return;
    const count = uv.count;
    const colors = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const u = uv.getX(i), v = uv.getY(i);
      const du = insetU > 0 ? Math.max(0, Math.min(1, Math.min(u, 1 - u) / insetU)) : 1;
      const dv = insetV > 0 ? Math.max(0, Math.min(1, Math.min(v, 1 - v) / insetV)) : 1;
      const t = Math.min(du, dv);
      colors[i * 3 + 0] = FEATHER_COLOR.r + (1 - FEATHER_COLOR.r) * t;
      colors[i * 3 + 1] = FEATHER_COLOR.g + (1 - FEATHER_COLOR.g) * t;
      colors[i * 3 + 2] = FEATHER_COLOR.b + (1 - FEATHER_COLOR.b) * t;
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  }

  const outline = buildFullOutline();
  const frontGeo = buildCapGeometry(outline, halfD, false);
  const backGeo = buildCapGeometry(outline, -halfD, true);
  addEdgeFeather(frontGeo, 0.05, 0.05);
  addEdgeFeather(backGeo, 0.05, 0.05);

  const frontMat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true, ...plasticParams, side: THREE.DoubleSide });
  const backMat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true, ...plasticParams, side: THREE.DoubleSide });
  const frontMesh = new THREE.Mesh(frontGeo, frontMat);
  const backMesh = new THREE.Mesh(backGeo, backMat);
  bodyGroup.add(frontMesh, backMesh);

  function applyPhoto(mat, dataUri) {
    if (!dataUri) return;
    const tex = new THREE.TextureLoader().load(dataUri);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    mat.map = tex;
    mat.needsUpdate = true;
  }

  function applyMatTransform(mat, repeatX, repeatY, offsetX, offsetY) {
    if (!mat || !mat.map) return;
    const tex = mat.map;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.center.set(0.5, 0.5);
    tex.repeat.set(repeatX, repeatY);
    tex.offset.set(offsetX, offsetY);
    tex.needsUpdate = true;
  }
  applyMatTransform(frontMat, 0.94, 0.94, 0, 0);
  applyMatTransform(backMat, 0.94, 0.94, 0, 0);

  // --- Top/bottom short edges: cropped to just the flat straight run
  // (curved end-caps excluded), so the texture stretches edge-to-edge
  // across the SW x BOX_D wall with no rounded-corner artifacts. ---
  function makeWrapMaterial(dataUri) {
    const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true, ...plasticParams, side: THREE.DoubleSide });
    if (dataUri) {
      const tex = new THREE.TextureLoader().load(dataUri);
      if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
      else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.center.set(0.5, 0.5);
      mat.map = tex;
    } else {
      mat.color = new THREE.Color(BODY_COLOR);
    }

  function buildCornerPillarBentClean(c, flipU, bulge) {
    const pts = arcPoints(c.cx, c.cy, CORNER_R, c.a0, c.a0 + HALF_PI, CORNER_SEGS);
    const bulgePts = arcPoints(c.cx, c.cy, CORNER_R + bulge, c.a0, c.a0 + HALF_PI, CORNER_SEGS);
    function buildHalf(zNear, zFar, vAtNear, vAtFar, ringNear, ringFar) {
      const positions = [], normals = [], uvs = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const ringA = ringNear[i], ringB = ringNear[i + 1];
        const farA = ringFar[i], farB = ringFar[i + 1];
        const na = new THREE.Vector2(a.x - c.cx, a.y - c.cy).normalize();
        const nb = new THREE.Vector2(b.x - c.cx, b.y - c.cy).normalize();
        let u0 = i / (pts.length - 1), u1 = (i + 1) / (pts.length - 1);
        if (flipU) { u0 = 1 - u0; u1 = 1 - u1; }
        positions.push(ringA.x, ringA.y, zNear,  farA.x, farA.y, zFar,  farB.x, farB.y, zFar);
        positions.push(ringA.x, ringA.y, zNear,  farB.x, farB.y, zFar,  ringB.x, ringB.y, zNear);
        normals.push(na.x, na.y, 0,  na.x, na.y, 0,  nb.x, nb.y, 0);
        normals.push(na.x, na.y, 0,  nb.x, nb.y, 0,  nb.x, nb.y, 0);
        uvs.push(u0, vAtNear, u0, vAtFar, u1, vAtFar,  u0, vAtNear, u1, vAtFar, u1, vAtNear);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      return geo;
    }
    const backGeo = buildHalf(-halfD, 0, 0, 1, pts, bulgePts);
    const frontGeo = buildHalf(0, halfD, 0, 1, bulgePts, pts);
    return { backGeo, frontGeo };
  }

  function makeCleanMat(dataUri) {
    const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true, ...plasticParams, side: THREE.DoubleSide });
    const tex = new THREE.TextureLoader().load(dataUri);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    mat.map = tex;
    return mat;

  const CORNER_SEAM_BULGE = 0.05;
  const pillarFlip = [false, true, false, true];

  // Esquinas laterales (pilares curvos) eliminadas del render a pedido del usuario.

  function addSideWall(width, height, x, y, z, rotX, rotY, mapUrlOrMat) {
    const geo = new THREE.PlaneGeometry(width, height, 14, 14);
    addEdgeFeather(geo, 0.06, 0.06);
    // Melt the two ends inward (toward the plane's own center) near where
    // it meets the long side walls -- like the plastic was warmed and
    // curled at the corner instead of a sharp square miter. Pure geometry
    // bend on the existing mesh/texture, no separate patch or new photo.
    (function meltEnds() {
      // Exact quarter-circle (same center/radius as the body's own rounded
      // corners) so this curl and the matching one on the side wall trace
      // the identical arc and meet with zero gap -- not just an
      // approximation that happens to look close.
      const halfW2 = width / 2;
      const cDist = halfW2 - CORNER_R; // where the un-melted flat part ends
      const pos = geo.attributes.position;
      const col = geo.attributes.color; // already set by addEdgeFeather above
      for (let vi = 0; vi < pos.count; vi++) {
        const px = pos.getX(vi);
        const dx = Math.abs(px) - cDist;
        if (dx > 0 && dx < CORNER_R) {
          const meltAmount = CORNER_R - Math.sqrt(CORNER_R * CORNER_R - dx * dx);
          pos.setZ(vi, pos.getZ(vi) - meltAmount);
        } else if (dx >= CORNER_R) {
          pos.setZ(vi, pos.getZ(vi) - CORNER_R);
        }
        // Shadow starts a bit BEFORE the melt (in the still-flat part)
        // and reaches strong darkness right at the tip, so it clearly
        // reads at any zoom/angle -- masks the seam against the side
        // wall's own curl instead of a visible cut.
        // Top band needs a noticeably wider/darker shadow than the
        // bottom -- its photo reads lighter/more different against the
        // side wall's, so it needs extra help to hide the seam.
        const topBoost = y > 0 ? 1.6 : 1.0;
        const shadowZone = CORNER_R * 4.5 * topBoost;
        const dShadow = Math.max(0, Math.min(1, (dx + shadowZone - CORNER_R) / shadowZone));
        if (col && dShadow > 0) {
          const extra = 1 - dShadow * dShadow * 1.0;
          col.setX(vi, col.getX(vi) * extra);
          col.setY(vi, col.getY(vi) * extra);
          col.setZ(vi, col.getZ(vi) * extra);
        }
      }
      if (col) col.needsUpdate = true;
      pos.needsUpdate = true;
      geo.computeVertexNormals();
    })();
    let mat;
    if (mapUrlOrMat && mapUrlOrMat.isMaterial) {
      mat = mapUrlOrMat;
    } else {
      mat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true, ...plasticParams, side: THREE.DoubleSide });
      if (mapUrlOrMat) {
        const tex = new THREE.TextureLoader().load(mapUrlOrMat);
        if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
        else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
        mat.map = tex;
      } else {
        mat.color = new THREE.Color(BODY_COLOR);
      }
    }
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.rotation.set(rotX, rotY, 0);
    bodyGroup.add(mesh);
    return mesh;
  }

  function addBentWall(xSign, height, bulge, texAUrl, texBUrl) {
    const half = BOX_D / 2;
    const x0 = xSign * halfW;
    const pts = [
      { x: x0, z: -half },
      { x: x0 + xSign * bulge, z: 0 },

    const halfH2 = height / 2;
    const singleUrl = texAUrl || texBUrl;
    let sharedTex = null;
    if (singleUrl) {

      if (THREE.SRGBColorSpace) sharedTex.colorSpace = THREE.SRGBColorSpace;
      else if (THREE.sRGBEncoding) sharedTex.encoding = THREE.sRGBEncoding;
    }
    // Subdivided so the edge-darkening only lives in a thin band right at
    // each seam (top/bottom against the corner fill, outer edge against the
    // front/back face) instead of a gradient spanning the whole surface.
    const segsV = 16, segsU = 6;
    const insetV = 0.06, insetOuter = 0.18;
    for (let i = 0; i < 2; i++) {
      const a = pts[i], b = pts[i + 1];
      const dx = b.x - a.x, dz = b.z - a.z;
      let nx = dz, nz = -dx;
      const nlen = Math.sqrt(nx * nx + nz * nz) || 1;
      nx /= nlen; nz /= nlen;
      if (nx * xSign < 0) { nx = -nx; nz = -nz; }

      const u0 = i * 0.5, u1 = (i + 1) * 0.5;
      const positions = [];
      const normals = [];
      const uvs = [];
      const colors = [];
      const grid = [];
      // Exact quarter-circle (same center/radius as the body's own rounded
      // corners, and the same formula used on the top/bottom band's own
      // end-melt) so the two pieces trace the identical arc and meet with
      // zero gap instead of just approximating a curl.
      const cDist = height / 2 - CORNER_R;
      for (let vi = 0; vi <= segsV; vi++) {
        const vf = vi / segsV;
        const y = -halfH2 + vf * height;
        const row = [];
        for (let ui = 0; ui <= segsU; ui++) {
          const uf = ui / segsU;
          const dy = Math.abs(y) - cDist;
          let meltAmount = 0;
          if (dy > 0 && dy < CORNER_R) {
            meltAmount = CORNER_R - Math.sqrt(CORNER_R * CORNER_R - dy * dy);
          } else if (dy >= CORNER_R) {
            meltAmount = CORNER_R;
          }
          const x = a.x + (b.x - a.x) * uf - xSign * meltAmount;
          const z = a.z + (b.z - a.z) * uf;
          // Tilt the normal from the flat wall direction toward
          // straight-up/down as we curl into the melt, so the lighting
          // rounds off too instead of staying flat-shaded on the curl.
          let nxP = nx, nyP = 0, nzP = nz;
          if (dy > 0) {
            const f = Math.min(1, dy / CORNER_R);
            const ySign = y >= 0 ? 1 : -1;
            nyP = f * ySign;
            const scale = Math.sqrt(Math.max(0, 1 - nyP * nyP));
            nxP = nx * scale; nzP = nz * scale;
          }
          // uf=0 is always the OUTER edge (against front/back); uf=1 is the
          // inner joint shared with the other half (same continuous photo).
          // Same strengthened, wider shadow treatment as the top/bottom
          // ends: reads clearly at any zoom/angle instead of a hard cut
          // against the front/back face.
          const dOuterRaw = Math.max(0, Math.min(1, uf / insetOuter));
          const dOuter = 0.1 + 0.9 * dOuterRaw;
          const dV = Math.max(0, Math.min(1, Math.min(vf, 1 - vf) / insetV));
          // Shadow starts a bit BEFORE the curl begins and reaches
          // strong darkness right at the tip, so it clearly reads at any
          // zoom/angle -- masks the seam against the top/bottom band's
          // own curl instead of a visible cut.
          // Same extra boost at the top end as the top band uses, so
          // the two sides of that seam get matching, stronger coverage.
          const topBoost = y > 0 ? 1.6 : 1.0;
          const shadowZone = CORNER_R * 4.5 * topBoost;
          const dShadow = Math.max(0, Math.min(1, (dy + shadowZone - CORNER_R) / shadowZone));
          const t = Math.min(dOuter, dV, 1 - dShadow * dShadow * 1.0);
          row.push({
            x, y, z,
            nxP, nyP, nzP,
            u: u0 + (u1 - u0) * uf,
            v: vf,
            r: FEATHER_COLOR.r + (1 - FEATHER_COLOR.r) * t,
            g: FEATHER_COLOR.g + (1 - FEATHER_COLOR.g) * t,
            bl: FEATHER_COLOR.b + (1 - FEATHER_COLOR.b) * t,
          });
        }
        grid.push(row);
      }
      for (let vi = 0; vi < segsV; vi++) {
        for (let ui = 0; ui < segsU; ui++) {
          const p00 = grid[vi][ui], p01 = grid[vi][ui + 1];
          const p10 = grid[vi + 1][ui], p11 = grid[vi + 1][ui + 1];
          const tri = [p00, p01, p11, p00, p11, p10];
          tri.forEach(p => {
            positions.push(p.x, p.y, p.z);
            normals.push(p.nxP, p.nyP, p.nzP);
            uvs.push(p.u, p.v);
            colors.push(p.r, p.g, p.bl);
          });
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true, ...plasticParams, side: THREE.DoubleSide });
      if (sharedTex) {
        mat.map = sharedTex;
      } else {
        mat.color = new THREE.Color(BODY_COLOR);
      }
      bodyGroup.add(new THREE.Mesh(geo, mat));
    }
  }

  addSideWall(BOX_W, BOX_D, 0, halfH, 0, -HALF_PI, 0, topEndTex);
  addSideWall(BOX_W, BOX_D, 0, -halfH, 0, HALF_PI, 0, bottomEndTex);

  // --- Corner fillers: close the small curved gap between the top/bottom
  // bands and the left/right side walls (plain body-color plastic, no seam
  // photo needed since it's a small uniform-color wedge). ---
  // Baked shading strip: highlight along the curve's apex (like a real
  // rounded edge catching light) fading to a darker crease at both seams
  // (where it meets the flat top/bottom band and the side wall), plus a
  // faint vertical falloff toward front/back. Hides the flat-fill look.
  
  const shadowTex = (function () {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(128, 128, 10, 128, 128, 128);
    g.addColorStop(0, 'rgba(0,0,0,0.45)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  })();
  const shadowMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(7, 7),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
  );
  shadowMesh.position.set(0, -halfH - 0.6, 0);
  shadowMesh.rotation.x = -Math.PI / 2;
  scene.add(shadowMesh);

  let isDown = false;
  let lastX = 0, lastY = 0;
  let rotY = 0, rotX = 0;
  let targetRotY = rotY, targetRotX = rotX;

  function pointerDown(x, y) { isDown = true; lastX = x; lastY = y; }
  function pointerMove(x, y) {
    if (!isDown) return;
    const dx = x - lastX, dy = y - lastY;
    lastX = x; lastY = y;
    targetRotY += dx * 0.008;
    targetRotX += dy * 0.008;
    targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
  }
  function pointerUp() { isDown = false; }

  canvas.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);
  canvas.addEventListener('touchstart', e => { const t = e.touches[0]; pointerDown(t.clientX, t.clientY); }, { passive: true });
  canvas.addEventListener('touchmove', e => { const t = e.touches[0]; pointerMove(t.clientX, t.clientY); }, { passive: true });
  canvas.addEventListener('touchend', pointerUp);

  let dist = 15;
  let targetDist = dist;
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    targetDist += e.deltaY * 0.015;
    targetDist = Math.max(8, Math.min(24, targetDist));
  }, { passive: false });

  let pinchStart = null;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchStart = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStart) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      targetDist += (pinchStart - d) * 0.025;
      targetDist = Math.max(8, Math.min(24, targetDist));
      pinchStart = d;
    }
  }, { passive: true });

  const STATIC_PREVIEW = new URLSearchParams(location.search).get('static') === '1';
  function animate() {
    requestAnimationFrame(animate);
    if (!STATIC_PREVIEW) targetRotY += 0.0035;
    rotY += (targetRotY - rotY) * 0.12;
    rotX += (targetRotX - rotX) * 0.12;
    dist += (targetDist - dist) * 0.12;
    group.rotation.y = rotY;
    group.rotation.x = rotX;
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  }

  resize();
  animate();
})();

<button id="capture-btn" style="position:fixed;left:10px;bottom:10px;z-index:999;padding:8px 14px;background:#111;color:#fff;border:0;border-radius:6px;font:13px system-ui;cursor:pointer;display:none;">Descargar imagen (WEBP)</button>
<script>
(function() {
  if (new URLSearchParams(location.search).get('capture') !== '1') return;
  var btn = document.getElementById('capture-btn');
  btn.style.display = 'block';
  btn.addEventListener('click', function() {
    var canvas = document.getElementById('viewer-canvas');
    canvas.toBlob(function(blob) {
      if (!blob) { alert('No se pudo capturar la imagen. Intenta girar el modelo y volver a intentar.'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'salind-11-4g.webp';
      a.click();
    }, 'image/webp', 0.92);
  });
})();
</script>
