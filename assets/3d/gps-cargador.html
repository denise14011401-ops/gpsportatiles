<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS cargador portátil · Visor 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    color: #eef1f6;
  }
  .viewer-wrap {
    position: relative;
    width: 100%;
    height: 100vh;
  }
  #viewer-canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #viewer-canvas:active { cursor: grabbing; }
  .hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #8b95a8;
    background: rgba(0,0,0,0.35);
    padding: 6px 12px;
    border-radius: 999px;
    letter-spacing: 0.2px;
    pointer-events: none;
    white-space: nowrap;
  }

</style>
</head>
<body>

<div class="viewer-wrap">
  <canvas id="viewer-canvas"></canvas>
  <div class="hint" style="display:none;">Arrastrá para girar · rueda / pellizco para zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('viewer-canvas');
  const wrap = canvas.parentElement;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 0, 20);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  else if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;

  function resize() {
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  scene.add(new THREE.AmbientLight(0xffffff, 0.85));

  const key = new THREE.DirectionalLight(0xffffff, 1.3);
  key.position.set(5, 7, 8);
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xaac8ff, 0.6);
  fill.position.set(-6, 2, -4);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0xffe9b0, 0.5);
  rim.position.set(0, -4, -6);
  scene.add(rim);

  const group = new THREE.Group();
  scene.add(group);

  // Proportions measured directly from the real product photos. Photo #7
  // (a clean straight-on shot of the port panel alone) is the ground truth
  // for the head's true cross-section: it's a wide, flat, pill-shaped
  // rectangle, roughly 2:1 (width:height) — NOT a squarish box like earlier
  // drafts assumed. Unlike the round GPS puck, this body isn't a simple
  // lathe: it's that rounded rectangular "head" (with the USB-C/USB-A port
  // panel on its outward end) sitting on a tapered cylindrical neck that
  // ends in a metal cigarette-lighter pin.
  const BOX_W = 3.6;         // head width (X)
  const BOX_D = 1.8;         // head depth (Z) — half of BOX_W, matches photo #7's ~2:1 ratio
  const BOX_H = 2.2;         // head height (Y) — trimmed a bit more off the top, stays compact
  const BOX_CORNER_R = 0.42; // rounded-corner radius — modest, boxy rounding (not pill-shaped)
  const CORNER_SEGS = 14;    // arc segments per corner

  // --- Head/handle transition (fillet) ---
  // Real injection-molded chargers have the head flare continuously down
  // into the handle, with no seam and no sudden change in curvature — a
  // single molded surface. These constants drive that transition (see
  // buildNeckProfile / buildBodyLoftGeometry).
  const NECK_TOP_R = 0.84;  // handle radius — the handle itself is a straight tube at this radius (no belly); widened another ~10% from 0.76 (final pass) so the neck reads closer to the reference's thicker handle
  const TRANS_H = 1.3;      // height of the transition zone — taller than before so the flare reads as gradual, not abrupt
  const TRANS_SEGS = 40;    // vertical resolution of the transition loft (higher = smoother fillet; doubled so the two narrow steps below get enough rings to actually read)
  const NECK_END_R = 0.30;  // handle radius where the plastic hands off to the metal pin
  const NECK_END_Y = -2.65; // height where the plastic neck ends and the metal pin begins — the "trompo" taper is short/quick, not a long cone

  // Visible molded collar where the head assembles onto the neck/handle --
  // ONE subtle step/lip, NOT a squared-off block and NOT a double
  // staircase. An earlier pass tried two stacked steps; the second (lower)
  // one read as an extra, unwanted notch right before the neck, so it's
  // been removed -- this is back to a single flat shelf, one step down,
  // then a smooth taper the rest of the way to the neck.
  //
  //   Cabeza
  //    ────┐          <- shelf, flush with the head wall (flat, short)
  //        \___         <- the one step down
  //            \         <- smooth taper the rest of the way to the neck
  //             \
  //              cuello
  //
  // jointedValue() walks a chain of flat/stepped control points (SHELF ->
  // STEP -> taper -> neck), each consecutive pair blended with
  // smootherstep so it's one continuous surface (no real seam/crease).
  //
  // STEP_FRAC is a FRACTION of each dimension's own (head - neck) range
  // rather than a fixed unit -- hw's range and hd's range are very
  // different sizes, so a fixed absolute depth that looks right on hw
  // would swallow hd's entire range and overshoot past the neck value,
  // creating a false pinch right at the bottom. Scaling by a fraction of
  // each dimension's own range keeps the step proportionate on every
  // dimension (hw, hd, and cr, which shrinks rather than grows from neck
  // to head) automatically.
  // Baked-in final values: STEP_FRAC=0
  // disables the carved-in step entirely (it kept reading as an open cut
  // on the lateral sides no matter how shallow) -- the visible molded line
  // at the head/neck junction is now handled instead by a separate "raya"
  // (a proud/raised ring, not a carved notch) added to the default stripes
  // list below, which doesn't have that cut-through-the-wall problem.
  let LIP_T = 0.990;
  let GROOVE_T = 0.950;
  let STEP_FRAC = 0.000;
  function smootherstep(t) {
    return t * t * t * (t * (t * 6 - 15) + 10);
  }
  function jointedValue(tRaw, neckVal, headVal) {
    const dir = headVal >= neckVal ? 1 : -1;
    const range = Math.abs(headVal - neckVal);
    const shelfVal = headVal - dir * (STEP_FRAC * range);
    const points = [
      { t: 1,        val: headVal },
      { t: LIP_T,    val: headVal },
      { t: GROOVE_T, val: shelfVal },
      { t: 0,        val: neckVal }
    ];
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i], b = points[i + 1];
      if (tRaw <= a.t && tRaw >= b.t) {
        const span = a.t - b.t;
        const u = span > 0 ? (tRaw - b.t) / span : 1;
        return b.val + (a.val - b.val) * smootherstep(u);
      }
    }
    return tRaw > 1 ? headVal : neckVal;
  }

  // The device is solid black plastic all over (only the pin tip and the
  // two spring side-contacts are bare metal, as in the real photos).
  const BODY_COLOR = 0x000000;      // solid black plastic -- baked in from the live editor's "Color plástico" picker
  const METAL_COLOR = 0x38311e;     // pin / spring-contact metal -- baked in from the live editor's "Color pines" picker
  // Plastic is a DIELECTRIC -- metalness should be near 0. The old
  // metalness:0.6 made every plastic surface (head/handle/taper) render
  // with a flat, semi-metallic sheen instead of true plastic reflectance,
  // which read as cheap opaque jug/jerry-can plastic ("galón") rather than
  // sleek charger-housing ABS. Low metalness + moderate roughness gives
  // the soft, slightly glossy highlight real molded plastic has.
  const plasticParams = { roughness: 0.35, metalness: 0.05 };
  // At metalness:1.0, MeshStandardMaterial gets essentially NO diffuse
  // contribution -- its color only shows through specular/environment
  // reflections, and this scene has no environment map (only ambient +
  // directional lights). So the pin/contacts rendered almost black instead
  // of the light gold METAL_COLOR, despite the color being set correctly.
  // Lowering metalness lets the gold albedo actually read as diffuse
  // color, while still keeping a shiny, slightly metallic highlight.
  const metalParams = { roughness: 0.3, metalness: 0.55 }; // polished gold-plated contact finish


  // A group holding the whole body, shifted so the object's visual center
  // (not the box/neck seam) sits at the world origin.
  const bodyGroup = new THREE.Group();
  bodyGroup.position.y = 0.025; // (pin tip at y≈-3.55, head top at y=TRANS_H+BOX_H=3.5) -> centers the object vertically
  group.add(bodyGroup);

  // --- Rounded-rectangle outline for the head's cross-section (X/Z plane) ---
  function buildRoundedRectOutline(halfW, halfD, cr, segs) {
    const pts = [];
    const corners = [
      { cx: halfW - cr, cz: halfD - cr, a0: 0 },
      { cx: -halfW + cr, cz: halfD - cr, a0: Math.PI / 2 },
      { cx: -halfW + cr, cz: -halfD + cr, a0: Math.PI },
      { cx: halfW - cr, cz: -halfD + cr, a0: 3 * Math.PI / 2 }
    ];
    corners.forEach(c => {
      for (let i = 0; i <= segs; i++) {
        const a = c.a0 + (Math.PI / 2) * (i / segs);
        pts.push(new THREE.Vector2(c.cx + cr * Math.cos(a), c.cz + cr * Math.sin(a)));
      }
    });
    return pts;
  }
  const headOutline = buildRoundedRectOutline(BOX_W / 2, BOX_D / 2, BOX_CORNER_R, CORNER_SEGS);

  // --- Flat cap (top or bottom of the head) built from the same outline,
  // with a straight-on planar UV projection (matches how the real photos
  // were shot), same approach as the round GPS model. ---
  function buildHeadCapGeometry(outline, yConst, halfW, halfD, uvScale) {
    const shape = new THREE.Shape(outline);
    const geo = new THREE.ShapeGeometry(shape);
    const pos = geo.attributes.position;
    const uv = geo.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const zShape = pos.getY(i); // shape's local "y" maps to world Z
      pos.setXYZ(i, x, yConst, zShape);
      uv.setXY(i, x / (halfW * 2 * uvScale) + 0.5, zShape / (halfD * 2 * uvScale) + 0.5);
    }
    pos.needsUpdate = true;
    uv.needsUpdate = true;
    geo.computeVertexNormals();
    return geo;
  }

  // --- Organic head/handle transition + head wall as ONE continuous,
  // curvature-continuous surface — not two separate meshes glued together.
  // A cubic smoothstep (the earlier version) only zeroes out the SLOPE at
  // the top/bottom of the flare, so the surface is tangent to the flat
  // sections above and below, but its curvature (2nd derivative) still
  // jumps abruptly right at each seam — and that curvature jump is exactly
  // what reads as "a tube glued into a block" instead of one molded part.
  // A quintic "smootherstep" (6t^5-15t^4+10t^3) zeroes out BOTH the slope
  // AND the curvature at both ends, so the flare eases into the straight
  // neck below and the straight head wall above with no visible seam.
  // The straight head wall itself is now just the top ring of this same
  // loft (not a separate geometry), so normals are smoothed continuously
  // across the whole surface in one computeVertexNormals() pass.
  function buildBodyLoftGeometry(neckR, halfW, halfD, cornerR, segs, transH, wallH, transLevels) {
    const grid = [];
    // Flare zone: handle's circle -> head's rounded-rect, y: 0..transH
    for (let k = 0; k <= transLevels; k++) {
      const tRaw = k / transLevels;
      const hw = jointedValue(tRaw, neckR, halfW);
      const hd = jointedValue(tRaw, neckR, halfD);
      const cr = Math.max(0.05, jointedValue(tRaw, neckR, cornerR));
      const y = transH * tRaw;
      const outline = buildRoundedRectOutline(hw, hd, cr, segs);
      grid.push(outline.map(p => new THREE.Vector3(p.x, y, p.y)));
    }
    // Straight head wall: just one more ring at the top, same cross-section
    // as the last flare ring (which is already exactly the head outline) —
    // this makes the wall a natural continuation of the same loft.
    const topOutline = buildRoundedRectOutline(halfW, halfD, cornerR, segs);
    grid.push(topOutline.map(p => new THREE.Vector3(p.x, transH + wallH, p.y)));

    const N = grid[0].length;
    const levels = grid.length - 1;
    const positions = [];
    for (let k = 0; k <= levels; k++)
      for (let i = 0; i < N; i++)
        positions.push(grid[k][i].x, grid[k][i].y, grid[k][i].z);
    const indices = [];
    for (let k = 0; k < levels; k++) {
      for (let i = 0; i < N; i++) {
        const i2 = (i + 1) % N;
        const a = k * N + i, b = k * N + i2, c = (k + 1) * N + i2, d = (k + 1) * N + i;
        indices.push(a, b, c,  a, c, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  const bodyLoftGeo = buildBodyLoftGeometry(NECK_TOP_R, BOX_W / 2, BOX_D / 2, BOX_CORNER_R, CORNER_SEGS, TRANS_H, BOX_H, TRANS_SEGS);
  const headTopGeo = buildHeadCapGeometry(headOutline, TRANS_H + BOX_H, BOX_W / 2, BOX_D / 2, 1.02);

  // Head left as clean, untextured geometry — no photo, no invented detail —
  // so a custom design/material can be applied to it later.
  const bodyLoftMat = new THREE.MeshStandardMaterial({ color: BODY_COLOR, ...plasticParams, side: THREE.DoubleSide });
  const headTopMat = new THREE.MeshStandardMaterial({ color: BODY_COLOR, ...plasticParams, side: THREE.DoubleSide });

  const bodyLoftMesh = new THREE.Mesh(bodyLoftGeo, bodyLoftMat);
  const headTopMesh = new THREE.Mesh(headTopGeo, headTopMat);
  // (added to bodyGroup via headGroup, further down where the wrapper
  // groups are set up)

  // --- Neck + metal pin: a real lathe revolve around Y, same technique as
  // the round GPS puck. Profile measured from the side-view photos, scaled
  // down to sit properly under the slimmer head. ---
  // Uniform Catmull-Rom interpolation through 2D control points (built by
  // hand instead of relying on a THREE.SplineCurve import, to keep this a
  // single dependency-free file). Passes exactly through every control
  // point while keeping the tangent continuous there, so the resulting
  // profile has no small kinks/facets — unlike the raw straight-line
  // polyline used before.
  function catmullRomPoints(pts, samplesPerSegment) {
    const n = pts.length;
    const at = i => pts[Math.max(0, Math.min(n - 1, i))];
    const result = [];
    for (let i = 0; i < n - 1; i++) {
      const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
      const steps = (i === n - 2) ? samplesPerSegment + 1 : samplesPerSegment;
      for (let s = 0; s < steps; s++) {
        const t = s / samplesPerSegment, t2 = t * t, t3 = t2 * t;
        const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
        const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
        result.push(new THREE.Vector2(x, y));
      }
    }
    return result;
  }

  // Split into two profiles (handle + taper) instead of one combined
  // lathe, so the "mango" (straight tube) and the "trompo" (the narrowing
  // taper) sit in their own groups with independent baked-in offsets/scale.
  const NECK_STRAIGHT_BOTTOM_Y = -2.3; // where the straight tube ends and the taper begins
  function buildHandleProfile() {
    return [
      new THREE.Vector2(NECK_TOP_R, 0),                  // top — matches the head transition
      new THREE.Vector2(NECK_TOP_R, NECK_STRAIGHT_BOTTOM_Y) // straight tube, constant radius (no belly)
    ];
  }
  // Trompo shape: a rounded profile made of a "bulge" control point and a
  // "waist" control point between the tube above and the metal pin below.
  let TAPER_BULGE_R = 0.570;
  let TAPER_BULGE_Y_OFFSET = -0.150; // relative to the tube's bottom (NECK_STRAIGHT_BOTTOM_Y)
  let TAPER_WAIST_R = 0.390;
  // Clamped to -0.300 instead of the pasted -0.600 -- NECK_END_Y sits only
  // 0.35 below NECK_STRAIGHT_BOTTOM_Y, so an offset past that pulls the
  // waist BELOW the pin hand-off point. That makes the taper's own lathe
  // profile double back on itself (non-monotonic Y), folding the surface
  // and opening a gap that let the gold pin show through above where the
  // trompo should fully cover it. -0.300 is the most extreme value that
  // still stays above the hand-off point (see the safety clamp in
  // buildTaperProfile() below, which guards against this even if a future
  // slider drag pushes past it again).
  let TAPER_WAIST_Y_OFFSET = -0.300; // relative to the tube's bottom
  // The taper's own top-ring radius, in ITS OWN local space -- kept
  // separate from NECK_TOP_R because taperGroup and handleGroup carry
  // different baked-in scale factors. If the top ring were just
  // NECK_TOP_R, the two meshes' touching edge would land at two different
  // WORLD radii -- a visible step/seam right where the mango meets the
  // trompo. syncTaperTopRadius() (further down, called once at load)
  // keeps this equal to the mango's world radius divided by the trompo's
  // own scale, so the two meshes' edges land on the exact same world
  // radius.
  let TAPER_TOP_R = NECK_TOP_R;
  function buildTaperProfile() {
    // Safety clamp: the waist must stay above (less negative than) the
    // pin hand-off point, and the bulge must stay above the waist -- past
    // that, the profile's Y stops being
    // smoothly narrowing, which opens a gap that lets the pin's gold
    // material show through the fold.
    const handoffOffset = NECK_END_Y - NECK_STRAIGHT_BOTTOM_Y; // most negative safe offset
    const safeWaistY = Math.max(TAPER_WAIST_Y_OFFSET, handoffOffset + 0.05);
    const safeBulgeY = Math.max(TAPER_BULGE_Y_OFFSET, safeWaistY + 0.05);
    const control = [
      new THREE.Vector2(TAPER_TOP_R, NECK_STRAIGHT_BOTTOM_Y),                          // top — matches the handle's bottom
      new THREE.Vector2(TAPER_BULGE_R, NECK_STRAIGHT_BOTTOM_Y + safeBulgeY),            // bulge
      new THREE.Vector2(TAPER_WAIST_R, NECK_STRAIGHT_BOTTOM_Y + safeWaistY),            // waist
      new THREE.Vector2(NECK_END_R, NECK_END_Y)                                        // hands off to the metal pin
    ];
    return catmullRomPoints(control, 8);
  }
  // The pin's own shaft radius, in ITS OWN local space -- same idea as
  // TAPER_TOP_R above, but for the taper-pin boundary. taperGroup and
  // pinGroup carry different baked-in scale factors, so without
  // compensating, the gold shaft would end up either narrower or WIDER
  // than the black taper's own end radius right where they meet.
  // syncPinTopRadius() (further down, called once at load) keeps this
  // equal to the taper's end-world-radius divided by the pin's own scale.
  let PIN_R = NECK_END_R;
  function buildPinProfile() {
    // Cylindrical shaft with a true rounded (hemispherical-cap) end, not a
    // cone tapering to a point — the real pin has thickness and volume all
    // the way to its rounded tip. Starts exactly where the plastic neck
    // ends (same radius, no step). Lengthened so the gold metal actually
    // protrudes and reads clearly, with only a short black section before it.
    const CYL_BOTTOM_Y = NECK_END_Y - 0.6;
    const pts = [
      new THREE.Vector2(PIN_R, NECK_END_Y),  // top, meets the neck
      new THREE.Vector2(PIN_R, CYL_BOTTOM_Y) // bottom of the straight cylindrical shaft
    ];
    const CAP_STEPS = 6;
    for (let i = 1; i <= CAP_STEPS; i++) {
      const a = (Math.PI / 2) * (i / CAP_STEPS);
      pts.push(new THREE.Vector2(PIN_R * Math.cos(a), CYL_BOTTOM_Y - PIN_R * Math.sin(a)));
    }
    return pts;
  }
  // --- Full-body outline lookup, used by the "rayas" (stripes) feature
  // below. Given any world Y, returns the cross-section outline that wraps
  // all the way around the charger at that height: a rounded rectangle in
  // the head/flare zone, or a circle (radius read off the handle/taper/pin
  // profiles) everywhere below. Every outline returned has the SAME point
  // count, so any two of them can be lofted into a closed band regardless
  // of which zone each one falls in.
  const STRIPE_N = 4 * (CORNER_SEGS + 1);
  function circleOutline(r, n) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      pts.push(new THREE.Vector2(r * Math.cos(a), r * Math.sin(a)));
    }
    return pts;
  }
  const PIN_SHAFT_BOTTOM_Y = NECK_END_Y - 0.6; // bottom of the pin's straight shaft (before its rounded cap)
  // `let`, not `const` -- rebuilt by rebuildTaperGeometry() whenever the
  // trompo's live shape sliders change, so stripes/rayas near the taper
  // zone (which read radiusAtY()) stay glued to the actual current shape
  // instead of the shape it had at page load.
  let radiusProfile = [
    ...buildHandleProfile(),
    ...buildTaperProfile(),
    new THREE.Vector2(NECK_END_R, PIN_SHAFT_BOTTOM_Y)
  ]; // ordered top (y=0) to bottom -- .x is radius, .y is height
  function radiusAtY(y) {
    for (let i = 0; i < radiusProfile.length - 1; i++) {
      const a = radiusProfile[i], b = radiusProfile[i + 1];
      if (y <= a.y && y >= b.y) {
        const t = (a.y - y) / ((a.y - b.y) || 1);
        return a.x + (b.x - a.x) * t;
      }
    }
    return y > radiusProfile[0].y ? radiusProfile[0].x : radiusProfile[radiusProfile.length - 1].x;
  }
  // NOTE: this reads the position/scale of headGroup/handleGroup/
  // taperGroup/pinGroup (defined further down) at call time, not just
  // instant-of-definition -- each piece has its own independent baked-in
  // offset, so a stripe's world Y has to be mapped back into each piece's
  // own local coordinates before asking it for a radius. Without this,
  // stripes are computed against the ORIGINAL unshifted body and end up
  // floating off the actual (shifted) surface in zones where the offsets
  // don't cancel out.
  function bodyOutlineAtY(yWorld) {
    const headY = headGroup.position.y;
    const handleY = handleGroup.position.y;
    const taperY = taperGroup.position.y;
    const taperS = taperGroup.scale.x || 1;
    const pinY = pinGroup.position.y;

    const headFlareBaseWorld = headY; // world Y of the head's own local y=0
    const handleBottomWorld = NECK_STRAIGHT_BOTTOM_Y + handleY;
    const taperBottomWorld = NECK_END_Y * taperS + taperY;
    const pinShaftBottomWorld = PIN_SHAFT_BOTTOM_Y + pinY;

    if (yWorld >= headFlareBaseWorld) {
      const yLocal = yWorld - headY;
      if (yLocal >= TRANS_H) {
        return buildRoundedRectOutline(BOX_W / 2, BOX_D / 2, BOX_CORNER_R, CORNER_SEGS);
      }
      const tRaw = Math.max(0, yLocal / TRANS_H);
      const hw = jointedValue(tRaw, NECK_TOP_R, BOX_W / 2);
      const hd = jointedValue(tRaw, NECK_TOP_R, BOX_D / 2);
      const cr = Math.max(0.05, jointedValue(tRaw, NECK_TOP_R, BOX_CORNER_R));
      return buildRoundedRectOutline(hw, hd, cr, CORNER_SEGS);
    }
    if (yWorld >= handleBottomWorld) {
      return circleOutline(NECK_TOP_R, STRIPE_N); // straight tube, constant radius
    }
    if (yWorld >= taperBottomWorld) {

  // Push an outline outward along each point's own radial direction --
  // works for both the circle and the (origin-centered) rounded rect --
  // so a stripe can sit slightly proud of the surface it wraps.
  function growOutline(outline, amount) {
    if (!amount) return outline;
    return outline.map(p => {
      const len = Math.hypot(p.x, p.y) || 1;
      const s = (len + amount) / len;
      return new THREE.Vector2(p.x * s, p.y * s);
    });
  }
  // Builds one closed 3D band that wraps fully around the charger between
  // yCenter-thickness/2 and yCenter+thickness/2 -- a true modeled ring, not
  // a flat decal, so it reads correctly from every angle as you turn it.
  // The protrusion eases in and back out across several intermediate rings
  // (a smootherstep triangular ramp, same curve family as the head/handle
  // fillet above) instead of jumping straight from flush to full protrusion
  // at two sharp rings -- that instant jump is what read as a "printed
  // line"; easing it in/out makes the ridge/groove look like a real molded
  // seam in the plastic instead of a decal sitting on top of it.
  const STRIPE_RAMP_LEVELS = 8;
  function buildStripeGeometry(yCenter, thickness, protrusion) {
    const yBottom = yCenter - thickness / 2;
    const levels = [];
    for (let k = 0; k <= STRIPE_RAMP_LEVELS; k++) {
      const tRaw = k / STRIPE_RAMP_LEVELS; // 0..1 across the band's own height
      const y = yBottom + thickness * tRaw;
      const tri = 1 - Math.abs(tRaw * 2 - 1); // 0 at both edges, 1 at the center
      const eased = tri * tri * tri * (tri * (tri * 6 - 15) + 10); // smootherstep
      levels.push({ y, outline: growOutline(bodyOutlineAtY(y), protrusion * eased) });
    }
    const N = levels[0].outline.length;
    const positions = [];
    levels.forEach(l => {
      for (let i = 0; i < N; i++) positions.push(l.outline[i].x, l.y, l.outline[i].y);
    });
    const indices = [];
    for (let k = 0; k < levels.length - 1; k++) {
      for (let i = 0; i < N; i++) {
        const i2 = (i + 1) % N;
        const a = k * N + i, b = k * N + i2, c = (k + 1) * N + i2, d = (k + 1) * N + i;
        indices.push(a, b, c,  a, c, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  // Shared by the neck's own wraparound canvas below: feather each photo's
  // own left/right edges back down to the flat black base color instead of
  // butting two different exposures edge-to-edge.
  function featherEdges(ctx, x, w, h, featherFrac) {
    const feather = w * featherFrac;
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    const gL = ctx.createLinearGradient(x, 0, x + feather, 0);
    gL.addColorStop(0, 'rgba(0,0,0,1)');
    gL.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gL;
    ctx.fillRect(x, 0, feather, h);
    const gR = ctx.createLinearGradient(x + w - feather, 0, x + w, 0);
    gR.addColorStop(0, 'rgba(0,0,0,0)');
    gR.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = gR;
    ctx.fillRect(x + w - feather, 0, feather, h);
    ctx.restore();
  }

  const ROT_X_LIMIT = 1.2;

  function pointerDown(x, y) {
    isDown = true;
    autoRotate = false;
    lastX = x; lastY = y;
  }
  function pointerMove(x, y) {
    if (!isDown) return;
    const dx = x - lastX;
    const dy = y - lastY;
    lastX = x; lastY = y;

    targetRotX += dy * 0.008;
    targetRotX = Math.max(-ROT_X_LIMIT, Math.min(ROT_X_LIMIT, targetRotX));

        e.touches[0].clientY - e.touches[1].clientY
      );
      targetDist += (pinchStart - d) * 0.03;
      targetDist = Math.max(12, Math.min(32, targetDist));
      pinchStart = d;
    }
  }, { passive: true });

  function animate() {
    requestAnimationFrame(animate);

    if (autoRotate) {
      targetRotY += 0.006 * autoRotateDir; // continuous full-circle spin, no bounce-back limit
    }

    rotY += (targetRotY - rotY) * 0.12;
    rotX += (targetRotX - rotX) * 0.12;
    dist += (targetDist - dist) * 0.12;

    group.rotation.y = rotY;
    group.rotation.x = rotX;

    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  }

  resize();
  animate();
})();
</script>

<button id="capture-btn" style="position:fixed;left:10px;bottom:10px;z-index:999;padding:8px 14px;background:#111;color:#fff;border:0;border-radius:6px;font:13px system-ui;cursor:pointer;display:none;">Descargar imagen (WEBP)</button>
<script>
(function() {
  if (new URLSearchParams(location.search).get('capture') !== '1') return;
  var btn = document.getElementById('capture-btn');
  btn.style.display = 'block';
  btn.addEventListener('click', function() {
    var canvas = document.getElementById('viewer-canvas');
    canvas.toBlob(function(blob) {
      if (!blob) { alert('No se pudo capturar la imagen. Intenta girar el modelo y volver a intentar.'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gps-cargador.webp';
      a.click();
    }, 'image/webp', 0.92);
  });
})();
</script>
